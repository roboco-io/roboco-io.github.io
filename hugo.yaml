baseURL: "https://roboco.io"
title: "ROBOCO"
theme: "hello-friend-ng"
buildFuture: true

defaultContentLanguage: "ko"
defaultContentLanguageInSubdir: false

languages:
  ko:
    languageName: "한국어"
    languageCode: "ko-kr"
    weight: 1
    contentDir: "content/ko"
    title: "ROBOCO"
    params:
      homeSubtitle: "귀사가 소유하고 운영하는 소프트웨어 공장을 함께 만듭니다."
      description: "로보코는 귀사가 소유하고 운영하는 소프트웨어 공장을 함께 만듭니다. 실제 업무 파일럿부터 AI 네이티브 개발 체계 구축, 운영 고도화까지 함께합니다."
  en:
    languageName: "English"
    languageCode: "en-us"
    weight: 2
    contentDir: "content/en"
    title: "ROBOCO"
    params:
      homeSubtitle: "Build a software factory your team owns and runs."
      description: "ROBOCO helps you build a software factory your team owns and runs, from a real-work pilot to AI-native development and continuous operational improvement."
  ja:
    languageName: "日本語"
    languageCode: "ja"
    weight: 3
    contentDir: "content/ja"
    title: "ROBOCO"
    params:
      homeSubtitle: "貴社が所有し、運営するソフトウェアファクトリーを共に構築します。"
      description: "ROBOCOは貴社が所有・運営するソフトウェアファクトリーを共に構築します。実務パイロットからAIネイティブな開発体制の構築、運用の高度化まで伴走します。"

params:
  # SNS 공유(Open Graph/Twitter Card) 기본 섬네일 — 포스트 frontmatter의 images가 있으면 그것이 우선
  images:
    - "/images/og-default.png?v=2"
  author: "ROBOCO"
  email: "contact@roboco.io"
  dateform: "Jan 2, 2006"
  dateformShort: "Jan 2"
  dateformNum: "2006-01-02"
  dateformNumTime: "2006-01-02 15:04"

  # 테마 설정
  defaultTheme: "dark"
  disableReadOtherPosts: false
  enableSharingButtons: true
  enableGlobalLanguageMenu: true
  enableThemeToggle: true
  
  # 파비콘 설정
  favicon:
    color: "#434343"
    icons:
      # 브라우저 탭 파비콘
      - rel: "icon"
        type: "image/svg+xml"
        href: "/favicon/favicon.svg"
      - rel: "icon"
        type: "image/png"
        sizes: "16x16"
        href: "/favicon/favicon-16x16.png"
      - rel: "icon"
        type: "image/png"
        sizes: "32x32"
        href: "/favicon/favicon-32x32.png"
      - rel: "icon"
        type: "image/png"
        sizes: "96x96"
        href: "/favicon/favicon-96x96.png"
      # iOS 홈 화면 아이콘
      - rel: "apple-touch-icon"
        sizes: "180x180"
        href: "/favicon/apple-touch-icon.png"
      # 웹 앱 매니페스트
      - rel: "manifest"
        href: "/site.webmanifest"
    
    # 웹 앱 메타 태그
    meta:
      - name: "application-name"
        content: "ROBOCO"
      - name: "apple-mobile-web-app-title"
        content: "ROBOCO"
      - name: "apple-mobile-web-app-capable"
        content: "yes"
      - name: "apple-mobile-web-app-status-bar-style"
        content: "default"
      - name: "msapplication-TileColor"
        content: "#2d89ef"
      - name: "theme-color"
        content: "#ffffff"
      - name: "title"
        content: "ROBOCO"
  
  # 푸터 설정
  footer:
    trademark: ROBOCO, Inc.
    rss: true

menu:
  main:
    - identifier: about
      name: About
      url: /about/
      weight: 10
    - identifier: solutions
      name: Solutions
      url: /solutions/
      weight: 20
    - identifier: products
      name: Products
      url: /products/
      weight: 25
    - identifier: research
      name: Research
      url: /research/
      weight: 27
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 30
    - identifier: contact
      name: Contact
      url: /contact/
      weight: 40
    - identifier: github
      name: GitHub
      url: https://github.com/roboco-io
      weight: 50
      params:
        external: true
        icon: github
  footer:
    - identifier: privacy
      name: Privacy Policy
      url: /privacy/
      weight: 10
    - identifier: security
      name: Security
      url: /security/
      weight: 20
    - identifier: dpa
      name: DPA
      url: /dpa/
      weight: 30
    - identifier: terms
      name: Terms
      url: /terms/
      weight: 40
