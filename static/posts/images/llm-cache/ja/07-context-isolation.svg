<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1040" viewBox="0 0 840 1040" role="img" aria-labelledby="title desc"><title id="title">07  共通入力を共有し、個人の文脈を分離する</title><desc id="desc">AとBは同じ公開プレフィックスを共有した後、個人の文脈に分岐します。区間別共有とアクセス制御のサポートが必要で、vLLMのリクエスト単位saltの動作とは異なります。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="1040" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="26.0" fill="#edf4ff" text-anchor="start">07  共通入力を共有し、個人の文脈を分離する</text><text x="32" y="89" font-size="21.0" fill="#b8c8dc" text-anchor="start">区間別の共有をサポートするシステムの設計概念</text><rect x="32" y="125" width="360" height="95" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="212" y="163" font-size="25.0" fill="#edf4ff" text-anchor="middle">ユーザーAのリクエスト</text><text x="212" y="198" font-size="21.0" fill="#b8c8dc" text-anchor="middle">公開マニュアル ＋ 個人の質問</text><rect x="448" y="125" width="360" height="95" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="628" y="163" font-size="25.0" fill="#edf4ff" text-anchor="middle">ユーザーBのリクエスト</text><text x="628" y="198" font-size="21.0" fill="#b8c8dc" text-anchor="middle">公開マニュアル ＋ 個人の質問</text><path d="M212 227 L350 293" stroke="#69dfbb" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M628 227 L490 293" stroke="#69dfbb" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="140" y="304" width="560" height="160" rx="16" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="420" y="345" font-size="28.0" fill="#69dfbb" text-anchor="middle">公開マニュアルのKVキャッシュを1部共有</text><text x="420" y="385" font-size="23.0" fill="#edf4ff" text-anchor="middle">最初のリクエスト：計算して保存</text><text x="420" y="424" font-size="22.0" fill="#edf4ff" text-anchor="middle">別ユーザー・後続のリクエスト：HITして再利用</text><path d="M330 470 L212 559" stroke="#8abaff" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M510 470 L628 559" stroke="#ffc580" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="32" y="573" width="360" height="163" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="212" y="615" font-size="26.0" fill="#8abaff" text-anchor="middle">A専用のコンテキスト</text><text x="212" y="655" font-size="20.0" fill="#b8c8dc" text-anchor="middle">個人の質問・会話・非公開資料</text><text x="212" y="697" font-size="20.0" fill="#8abaff" text-anchor="middle">Aの権限範囲内だけで処理・再利用</text><rect x="448" y="573" width="360" height="163" rx="16" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="628" y="615" font-size="26.0" fill="#ffc580" text-anchor="middle">B専用のコンテキスト</text><text x="628" y="655" font-size="20.0" fill="#b8c8dc" text-anchor="middle">個人の質問・会話・非公開資料</text><text x="628" y="697" font-size="20.0" fill="#ffc580" text-anchor="middle">Bの権限範囲内だけで処理・再利用</text><text x="420" y="664" font-size="40.0" fill="#b8c8dc" text-anchor="middle">×</text><text x="420" y="778" font-size="23.0" fill="#edf4ff" text-anchor="middle">共通入力の計算を共有し、個人の会話は分離します。</text><rect x="32" y="816" width="776" height="153" rx="16" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="56" y="854" font-size="24.0" fill="#ffc580" text-anchor="start">この構造を成立させる条件</text><text x="56" y="890" font-size="20.0" fill="#edf4ff" text-anchor="start">エンジンが公開・個人の区間別に境界とアクセス制御を強制します。</text><text x="56" y="927" font-size="19.0" fill="#b8c8dc" text-anchor="start">vLLMのリクエスト単位のcache_saltだけでは、この構造になりません。</text><text x="32" y="1009" font-size="21.0" fill="#b8c8dc" text-anchor="start">GPU → CPU → リモートストレージでも共有権限を維持します。</text></g></svg>