<svg xmlns="http://www.w3.org/2000/svg" width="840" height="590" viewBox="0 0 840 590" role="img" aria-labelledby="title desc"><title id="title">01  処理済みの文書から計算を続ける</title><desc id="desc">最初のリクエストで文書のKVキャッシュを作り、後続では再利用します。新しい質問の処理と回答の生成は必要です。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="590" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">01  処理済みの文書から計算を続ける</text><text x="32" y="90" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">最初のリクエスト：文書を計算し、結果を保存</text><rect x="32" y="116" width="270" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="167.0" y="159.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">共通文書を読む</text><text x="167.0" y="191.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">プリフィル：入力処理</text><path d="M307 164 L355 164" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="365" y="116" width="190" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="460.0" y="172.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">質問を読む</text><path d="M560 164 L607 164" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="617" y="116" width="190" height="96" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="712.0" y="159.0" fill="#ffc580" font-size="23.0" text-anchor="middle" font-weight="600">回答を生成</text><text x="712.0" y="191.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">デコーディング</text><path d="M167 217 L167 257" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="32" y="267" width="270" height="76" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="167.0" y="313.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">文書のKVキャッシュ</text><text x="32" y="393" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">後続のリクエスト：保存済みの計算結果を再利用</text><rect x="32" y="420" width="270" height="96" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="167.0" y="463.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">KVキャッシュを再利用</text><text x="167.0" y="495.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">文書の再計算を省略</text><path d="M307 468 L355 468" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="365" y="420" width="190" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="460.0" y="476.0" fill="#8abaff" font-size="20.5" text-anchor="middle" font-weight="600">新しい質問を読む</text><path d="M560 468 L607 468" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="617" y="420" width="190" height="96" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="712.0" y="463.0" fill="#ffc580" font-size="20.5" text-anchor="middle" font-weight="600">新しい回答を生成</text><text x="712.0" y="495.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">引き続き必要</text><text x="32" y="558" fill="#b8c8dc" font-size="21.0" text-anchor="start" font-weight="400">保存するのは回答ではなく、入力処理で作った数値配列です。</text></g></svg>