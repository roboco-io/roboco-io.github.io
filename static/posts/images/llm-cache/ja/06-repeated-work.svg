<svg xmlns="http://www.w3.org/2000/svg" width="840" height="665" viewBox="0 0 840 665" role="img" aria-labelledby="title desc"><title id="title">06  リクエストが増えると、再計算の差も広がる</title><desc id="desc">追加ミスなく共通文書を100回利用する仮想例です。新規プリフィルは1,050,000から60,000トークンに減りますが、コストや時間の比率ではありません。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="665" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">06  リクエストが増えると、再計算の差も広がる</text><text x="32" y="95" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">仮想例：共通文書10,000 ＋ 新しい質問500トークンを100回</text><text x="32" y="151" fill="#f1f5fb" font-size="23.0" text-anchor="start" font-weight="600">毎回、最初から入力を処理</text><rect x="32" y="174" width="776" height="64" rx="10" fill="#8abaff" /><text x="420" y="216" fill="#101c2d" font-size="26.0" text-anchor="middle" font-weight="700">1,050,000トークン</text><text x="32" y="298" fill="#f1f5fb" font-size="23.0" text-anchor="start" font-weight="600">共通文書を1回計算し、99回再利用</text><rect x="32" y="323" width="45" height="64" rx="8" fill="#69dfbb" /><text x="100" y="365" fill="#69dfbb" font-size="26.0" text-anchor="start" font-weight="700">新規プリフィルは60,000トークン</text><text x="32" y="441" fill="#b8c8dc" font-size="23.0" text-anchor="start" font-weight="400">10,000 + (500 × 100) = 60,000</text><rect x="32" y="485" width="776" height="102" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="420.0" y="531.0" fill="#ffc580" font-size="23.0" text-anchor="middle" font-weight="600">新しく処理する入力トークンが約94.3%減少</text><text x="420.0" y="563.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">読み出し・メモリ・転送・回答生成のコストは残ります</text><text x="420" y="629" fill="#b8c8dc" font-size="22.0" text-anchor="middle" font-weight="400">トークン再処理の減少率と総コストの削減率は異なります</text></g></svg>