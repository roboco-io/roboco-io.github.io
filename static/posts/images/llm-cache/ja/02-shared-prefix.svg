<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" role="img" aria-labelledby="title desc"><title id="title">02  入力の先頭部分が一致する必要がある理由</title><desc id="desc">同じ指示と文書の後で質問が分岐します。先頭に異なる時刻を置くと、後続の文脈も変わります。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="650" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">02  入力の先頭部分が一致する必要がある理由</text><rect x="220" y="92" width="400" height="80" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="420.0" y="140.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">同じ共通指示 ＋ 製品文書</text><path d="M420 177 L420 212" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><text x="420" y="243" fill="#69dfbb" font-size="22.0" text-anchor="middle" font-weight="400">ここまで同じ入力 → 計算を共有</text><path d="M405 260 L185 309" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M435 260 L655 309" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="44" y="321" width="282" height="80" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="185.0" y="369.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">質問A：機能は？</text><rect x="514" y="321" width="282" height="80" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="655.0" y="369.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">質問B：連携は？</text><text x="420" y="445" fill="#f1f5fb" font-size="23.0" text-anchor="middle" font-weight="600">質問が違っても、先頭部分は再利用できます</text><path d="M32 477 H808" stroke="#65809e" /><text x="32" y="517" fill="#ffc580" font-size="23.0" text-anchor="start" font-weight="600">先頭部分を変えると？</text><rect x="32" y="542" width="190" height="74" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="127.0" y="587.0" fill="#ffc580" font-size="23.0" text-anchor="middle" font-weight="600">毎回異なる時刻</text><path d="M229 579 L271 579" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="282" y="542" width="526" height="74" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="545.0" y="587.0" fill="#ffc580" font-size="23.0" text-anchor="middle" font-weight="600">同じ文書でも、その前の文脈が変わります</text></g></svg>