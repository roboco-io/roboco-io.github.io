<svg xmlns="http://www.w3.org/2000/svg" width="840" height="590" viewBox="0 0 840 590" role="img" aria-labelledby="title desc"><title id="title">01  이미 읽은 문서에서 이어서 계산하기</title><desc id="desc">첫 요청은 문서와 질문을 처리하고 답변을 생성한다. 후속 요청은 문서의 KV 캐시를 재사용하되 새 질문 처리와 새 답변 생성은 수행한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="590" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27" text-anchor="start" font-weight="700">01  이미 읽은 문서에서 이어서 계산하기</text><text x="32" y="90" fill="#b8c8dc" font-size="22" text-anchor="start" font-weight="400">첫 요청: 문서를 계산하고 결과를 보관한다</text><rect x="32" y="116" width="270" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="167.0" y="159.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">긴 공통 문서 읽기</text><text x="167.0" y="191.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">프리필: 입력 처리</text><path d="M307 164 L355 164" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="116" width="190" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="460.0" y="172.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">질문 읽기</text><path d="M560 164 L607 164" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="617" y="116" width="190" height="96" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="712.0" y="159.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">답변 생성</text><text x="712.0" y="191.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">디코딩</text><path d="M167 217 L167 257" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="267" width="270" height="76" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="167.0" y="313.0" fill="#69dfbb" font-size="23" text-anchor="middle" font-weight="600">문서의 KV 캐시</text><text x="32" y="393" fill="#b8c8dc" font-size="22" text-anchor="start" font-weight="400">후속 요청: 저장한 계산 결과에서 이어간다</text><rect x="32" y="420" width="270" height="96" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="167.0" y="463.0" fill="#69dfbb" font-size="23" text-anchor="middle" font-weight="600">KV 캐시 재사용</text><text x="167.0" y="495.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">긴 문서의 재계산 생략</text><path d="M307 468 L355 468" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="365" y="420" width="190" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="460.0" y="476.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">새 질문 읽기</text><path d="M560 468 L607 468" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="617" y="420" width="190" height="96" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="712.0" y="463.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">새 답변 생성</text><text x="712.0" y="495.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">계속 필요함</text><text x="32" y="558" fill="#b8c8dc" font-size="21" text-anchor="start" font-weight="400">저장하는 것은 답변이 아니라, 입력을 처리하며 만든 숫자 배열이다.</text></g></svg>