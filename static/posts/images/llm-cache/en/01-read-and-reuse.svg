<svg xmlns="http://www.w3.org/2000/svg" width="840" height="590" viewBox="0 0 840 590" role="img" aria-labelledby="title desc"><title id="title">01  Continue from a document already processed</title><desc id="desc">The first request creates a document KV cache. Later requests reuse it, while still processing new questions and generating new answers.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="590" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">01  Continue from a document already processed</text><text x="32" y="90" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">First request: process the document and save its state</text><rect x="32" y="116" width="270" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="167.0" y="159.0" fill="#8abaff" font-size="22.2" text-anchor="middle" font-weight="600">Read shared document</text><text x="167.0" y="191.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Prefill: process input</text><path d="M307 164 L355 164" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="365" y="116" width="190" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="460.0" y="172.0" fill="#8abaff" font-size="22.9" text-anchor="middle" font-weight="600">Read question</text><path d="M560 164 L607 164" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="617" y="116" width="190" height="96" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="712.0" y="159.0" fill="#ffc580" font-size="19.9" text-anchor="middle" font-weight="600">Generate answer</text><text x="712.0" y="191.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Decoding</text><path d="M167 217 L167 257" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="32" y="267" width="270" height="76" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="167.0" y="313.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Document KV cache</text><text x="32" y="393" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">Later requests: continue from the saved state</text><rect x="32" y="420" width="270" height="96" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="167.0" y="463.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Reuse KV cache</text><text x="167.0" y="495.0" fill="#b8c8dc" font-size="16.4" text-anchor="middle" font-weight="400">Skip document recomputation</text><path d="M307 468 L355 468" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="365" y="420" width="190" height="96" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="460.0" y="476.0" fill="#8abaff" font-size="17.5" text-anchor="middle" font-weight="600">Read new question</text><path d="M560 468 L607 468" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="617" y="420" width="190" height="96" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="712.0" y="463.0" fill="#ffc580" font-size="18" text-anchor="middle" font-weight="600">New answer</text><text x="712.0" y="495.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Still required</text><text x="32" y="558" fill="#b8c8dc" font-size="19.9" text-anchor="start" font-weight="400">The cache stores numerical states from input processing, not an answer.</text></g></svg>