<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" role="img" aria-labelledby="title desc"><title id="title">05  Not every cache must stay on the GPU</title><desc id="desc">KV caches can be stored in GPU memory, CPU memory, SSD or remote storage. Reuse must outweigh transfer costs.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="640" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">05  Not every cache must stay on the GPU</text><rect x="160" y="92" width="520" height="90" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="420.0" y="132.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">GPU memory</text><text x="420.0" y="164.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Fast workspace for current computation</text><path d="M300 188 L300 229" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M540 229 L540 188" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="160" y="244" width="520" height="90" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="420.0" y="284.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">CPU memory</text><text x="420.0" y="316.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Keep KV caches outside the GPU</text><path d="M300 340 L300 381" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M540 381 L540 340" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="160" y="396" width="520" height="90" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="420.0" y="436.0" fill="#ffc580" font-size="23.0" text-anchor="middle" font-weight="600">SSD / remote storage</text><text x="420.0" y="468.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Store more cached state, depending on the setup</text><text x="32" y="550" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">Offload: free GPU space</text><text x="440" y="550" fill="#b8c8dc" font-size="22.0" text-anchor="start" font-weight="400">Reload: pay transfer costs</text><text x="420" y="604" fill="#f1f5fb" font-size="25.0" text-anchor="middle" font-weight="600">Reuse pays when retrieval costs less than recomputation</text></g></svg>