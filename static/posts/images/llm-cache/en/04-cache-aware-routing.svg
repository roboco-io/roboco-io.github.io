<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" role="img" aria-labelledby="title desc"><title id="title">04  Route requests to cached state</title><desc id="desc">The router balances cache reuse and server load. A cache miss requires recomputation or a supported cache transfer.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="640" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">04  Route requests to cached state</text><rect x="210" y="88" width="420" height="80" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="420.0" y="136.0" fill="#8abaff" font-size="21.1" text-anchor="middle" font-weight="600">New request with the same document</text><path d="M420 173 L420 208" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="210" y="220" width="420" height="90" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="420.0" y="260.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Request router</text><text x="420.0" y="292.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Consider cache location and server load</text><path d="M330 317 L220 384" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M510 317 L620 384" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6" /><rect x="40" y="400" width="350" height="116" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="215.0" y="453.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Server A: document cached</text><text x="215.0" y="485.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Continue from saved computation</text><rect x="450" y="400" width="350" height="116" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="625.0" y="453.0" fill="#ffc580" font-size="21.8" text-anchor="middle" font-weight="600">Server B: no document cache</text><text x="625.0" y="485.0" fill="#b8c8dc" font-size="17.3" text-anchor="middle" font-weight="400">Recompute or transfer cached state</text><text x="420" y="569" fill="#f1f5fb" font-size="23.0" text-anchor="middle" font-weight="600">If A is too busy, B may finish sooner.</text><text x="420" y="607" fill="#b8c8dc" font-size="21.0" text-anchor="middle" font-weight="400">Routing balances reuse benefits against queueing time.</text></g></svg>