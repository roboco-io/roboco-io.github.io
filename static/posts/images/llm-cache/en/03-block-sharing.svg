<svg xmlns="http://www.w3.org/2000/svg" width="840" height="695" viewBox="0 0 840 695" role="img" aria-labelledby="title desc"><title id="title">03  Share the cache in small blocks</title><desc id="desc">Requests A and B share common KV blocks. Unused blocks may be retained for reuse and replaced when space is needed. Simplified vLLM design.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="695" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27.0" text-anchor="start" font-weight="700">03  Share the cache in small blocks</text><rect x="32" y="95" width="180" height="78" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="122.0" y="142.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">Request A</text><rect x="32" y="216" width="180" height="78" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="122.0" y="263.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">Request B</text><path d="M218 134 L280 173" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M218 255 L280 202" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="290" y="142" width="215" height="90" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="397.5" y="195.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Shared block 1</text><path d="M510 187 L548 187" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="558" y="142" width="250" height="90" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="683.0" y="195.0" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Shared block 2</text><text x="420" y="347" fill="#69dfbb" font-size="23.0" text-anchor="middle" font-weight="600">Two requests reference one copy in memory</text><path d="M420 365 L420 408" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="120" y="422" width="600" height="90" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="420.0" y="462.0" fill="#8abaff" font-size="23.0" text-anchor="middle" font-weight="600">Keep blocks after both requests finish</text><text x="420.0" y="494.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">An opportunity for the next request to reuse them</text><path d="M420 518 L420 557" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="120" y="570" width="600" height="90" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="420.0" y="610.0" fill="#ffc580" font-size="23.0" text-anchor="middle" font-weight="600">When space is needed, replace unused blocks</text><text x="420.0" y="642.0" fill="#b8c8dc" font-size="18.0" text-anchor="middle" font-weight="400">Separate active blocks from reuse candidates</text></g></svg>