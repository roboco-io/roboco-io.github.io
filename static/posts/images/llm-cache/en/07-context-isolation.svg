<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1040" viewBox="0 0 840 1040" role="img" aria-labelledby="title desc"><title id="title">07  Share common input, isolate private context</title><desc id="desc">Users A and B share an identical public prefix, then branch into separate private contexts. This requires segment-level cache sharing and access control; it is not vLLM request-level salt behavior.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5" /></marker></defs><rect width="840" height="1040" rx="18" fill="#101c2d" /><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="26.0" fill="#edf4ff" text-anchor="start">07  Share common input, isolate private context</text><text x="32" y="89" font-size="21.0" fill="#b8c8dc" text-anchor="start">A design concept requiring segment-level sharing support</text><rect x="32" y="125" width="360" height="95" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="212" y="163" font-size="25.0" fill="#edf4ff" text-anchor="middle">User A’s request</text><text x="212" y="198" font-size="19.0" fill="#b8c8dc" text-anchor="middle">Public manual + private question</text><rect x="448" y="125" width="360" height="95" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="628" y="163" font-size="25.0" fill="#edf4ff" text-anchor="middle">User B’s request</text><text x="628" y="198" font-size="19.0" fill="#b8c8dc" text-anchor="middle">Public manual + private question</text><path d="M212 227 L350 293" stroke="#69dfbb" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M628 227 L490 293" stroke="#69dfbb" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="140" y="304" width="560" height="160" rx="16" fill="#192a40" stroke="#69dfbb" stroke-width="2" /><text x="420" y="345" font-size="23.7" fill="#69dfbb" text-anchor="middle">One shared KV cache for the public manual</text><text x="420" y="385" font-size="23.0" fill="#edf4ff" text-anchor="middle">First request: compute and store</text><text x="420" y="424" font-size="22.0" fill="#edf4ff" text-anchor="middle">Other users / later requests: HIT and reuse</text><path d="M330 470 L212 559" stroke="#8abaff" stroke-width="3" fill="none" marker-end="url(#a)" /><path d="M510 470 L628 559" stroke="#ffc580" stroke-width="3" fill="none" marker-end="url(#a)" /><rect x="32" y="573" width="360" height="163" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2" /><text x="212" y="615" font-size="26.0" fill="#8abaff" text-anchor="middle">A’s private context</text><text x="212" y="655" font-size="16.0" fill="#b8c8dc" text-anchor="middle">Private questions, chats and documents</text><text x="212" y="697" font-size="18" fill="#8abaff" text-anchor="middle">Use only within A’s permissions</text><rect x="448" y="573" width="360" height="163" rx="16" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="628" y="615" font-size="26.0" fill="#ffc580" text-anchor="middle">B’s private context</text><text x="628" y="655" font-size="16.0" fill="#b8c8dc" text-anchor="middle">Private questions, chats and documents</text><text x="628" y="697" font-size="18" fill="#ffc580" text-anchor="middle">Use only within B’s permissions</text><text x="420" y="664" font-size="40.0" fill="#b8c8dc" text-anchor="middle">×</text><text x="420" y="778" font-size="20.7" fill="#edf4ff" text-anchor="middle">Share the computation for common input; keep private chats separate.</text><rect x="32" y="816" width="776" height="153" rx="16" fill="#192a40" stroke="#ffc580" stroke-width="2" /><text x="56" y="854" font-size="24.0" fill="#ffc580" text-anchor="start">What this design requires</text><text x="56" y="890" font-size="18.9" fill="#edf4ff" text-anchor="start">The engine must enforce cache boundaries and access control per segment.</text><text x="56" y="927" font-size="19.0" fill="#b8c8dc" text-anchor="start">vLLM’s request-level cache_salt alone does not implement this design.</text><text x="32" y="1009" font-size="21.0" fill="#b8c8dc" text-anchor="start">Preserve permissions across GPU → CPU → remote storage.</text></g></svg>