<svg xmlns="http://www.w3.org/2000/svg" width="840" height="865" viewBox="0 0 840 865" role="img" aria-labelledby="title desc"><title id="title">다층 캐시의 저장 위치와 사용자 권한 경계</title><desc id="desc">공개 공유 영역, 사용자 A 전용 영역, 사용자 B 전용 영역의 논리적 권한 경계를 GPU 메모리, CPU 메모리, SSD와 원격 저장소의 모든 계층에서 유지하는 정책 목표를 나타낸다. 한 요청의 구간별 공유 지원은 엔진마다 다르며 자동으로 보장되지 않는다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="865" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27" text-anchor="start" font-weight="700">07  보관 장소가 바뀌어도 권한 경계는 유지</text><text x="32" y="86" fill="#b8c8dc" font-size="21" text-anchor="start" font-weight="400">공유 정책의 목표를 그린 개념도 · 엔진별 지원 확인 필요</text><rect x="155" y="114" width="195" height="535" rx="12" fill="#101c2d" stroke="#69dfbb" stroke-width="2" stroke-dasharray="8 6"/><text x="252.5" y="151" fill="#69dfbb" font-size="22" text-anchor="middle" font-weight="600">공개 영역</text><text x="252.5" y="183" fill="#b8c8dc" font-size="17" text-anchor="middle" font-weight="400">공유를 허용한 자료</text><rect x="169" y="217" width="167" height="68" rx="12" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="252.5" y="260" fill="#69dfbb" font-size="21" text-anchor="middle" font-weight="600">KV 블록</text><rect x="169" y="374" width="167" height="68" rx="12" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="252.5" y="417" fill="#69dfbb" font-size="21" text-anchor="middle" font-weight="600">KV 복사본</text><rect x="169" y="531" width="167" height="68" rx="12" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="252.5" y="574" fill="#69dfbb" font-size="21" text-anchor="middle" font-weight="600">저장된 KV</text><path d="M252.5 292 V360" fill="none" stroke="#69dfbb" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M252.5 449 V517" fill="none" stroke="#69dfbb" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="375" y="114" width="195" height="535" rx="12" fill="#101c2d" stroke="#8abaff" stroke-width="2" stroke-dasharray="8 6"/><text x="472.5" y="151" fill="#8abaff" font-size="22" text-anchor="middle" font-weight="600">사용자 A 전용</text><text x="472.5" y="183" fill="#b8c8dc" font-size="17" text-anchor="middle" font-weight="400">A의 개인 대화</text><rect x="389" y="217" width="167" height="68" rx="12" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="472.5" y="260" fill="#8abaff" font-size="21" text-anchor="middle" font-weight="600">KV 블록</text><rect x="389" y="374" width="167" height="68" rx="12" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="472.5" y="417" fill="#8abaff" font-size="21" text-anchor="middle" font-weight="600">KV 복사본</text><rect x="389" y="531" width="167" height="68" rx="12" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="472.5" y="574" fill="#8abaff" font-size="21" text-anchor="middle" font-weight="600">저장된 KV</text><path d="M472.5 292 V360" fill="none" stroke="#8abaff" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M472.5 449 V517" fill="none" stroke="#8abaff" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="595" y="114" width="195" height="535" rx="12" fill="#101c2d" stroke="#ffc580" stroke-width="2" stroke-dasharray="8 6"/><text x="692.5" y="151" fill="#ffc580" font-size="22" text-anchor="middle" font-weight="600">사용자 B 전용</text><text x="692.5" y="183" fill="#b8c8dc" font-size="17" text-anchor="middle" font-weight="400">B의 개인 대화</text><rect x="609" y="217" width="167" height="68" rx="12" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="692.5" y="260" fill="#ffc580" font-size="21" text-anchor="middle" font-weight="600">KV 블록</text><rect x="609" y="374" width="167" height="68" rx="12" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="692.5" y="417" fill="#ffc580" font-size="21" text-anchor="middle" font-weight="600">KV 복사본</text><rect x="609" y="531" width="167" height="68" rx="12" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="692.5" y="574" fill="#ffc580" font-size="21" text-anchor="middle" font-weight="600">저장된 KV</text><path d="M692.5 292 V360" fill="none" stroke="#ffc580" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M692.5 449 V517" fill="none" stroke="#ffc580" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="247" fill="#b8c8dc" font-size="21" text-anchor="start" font-weight="600">GPU</text><text x="32" y="277" fill="#b8c8dc" font-size="19" text-anchor="start" font-weight="400">메모리</text><text x="32" y="404" fill="#b8c8dc" font-size="21" text-anchor="start" font-weight="600">CPU</text><text x="32" y="434" fill="#b8c8dc" font-size="19" text-anchor="start" font-weight="400">메모리</text><text x="32" y="561" fill="#b8c8dc" font-size="21" text-anchor="start" font-weight="600">SSD·원격</text><text x="32" y="591" fill="#b8c8dc" font-size="19" text-anchor="start" font-weight="400">저장소</text><rect x="32" y="682" width="776" height="104" rx="12" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="420" y="722" fill="#f1f5fb" font-size="24" text-anchor="middle" font-weight="600">서버가 인증·권한으로 재사용 범위를 정한다</text><text x="420" y="759" fill="#b8c8dc" font-size="21" text-anchor="middle" font-weight="400">다른 사용자 영역의 조회·가져오기·재사용을 제한한다</text><text x="420" y="829" fill="#b8c8dc" font-size="20" text-anchor="middle" font-weight="400">공개 구간 공유 + 개인 구간 격리는 모든 엔진의 기본 기능이 아니다.</text></g></svg>