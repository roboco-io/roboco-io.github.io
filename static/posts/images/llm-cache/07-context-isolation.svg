<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1040" viewBox="0 0 840 1040" role="img" aria-labelledby="title desc"><title id="title">공통 프리픽스 공유와 개인 컨텍스트 분리</title><desc id="desc">사용자 A와 B의 동일한 공개 매뉴얼 입력은 하나의 KV 캐시로 모이고, 이후 개인 컨텍스트는 서로 다른 권한 경계로 분기한다. 이는 구간별 캐시 공유와 접근 통제를 지원하는 엔진의 설계 개념이며 vLLM 요청 단위 salt의 기본 동작이 아니다.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="1040" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, sans-serif"><text x="32" y="48" font-size="26" fill="#edf4ff" text-anchor="start">07  함께 읽는 자료는 공유하고, 개인 맥락은 분리한다</text><text x="32" y="89" font-size="21" fill="#b8c8dc" text-anchor="start">구간별 공유를 지원하는 시스템의 설계 개념</text><rect x="32" y="125" width="360" height="95" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="212" y="163" font-size="25" fill="#edf4ff" text-anchor="middle">사용자 A의 요청</text><text x="212" y="198" font-size="21" fill="#b8c8dc" text-anchor="middle">공개 매뉴얼 + 개인 질문</text><rect x="448" y="125" width="360" height="95" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="628" y="163" font-size="25" fill="#edf4ff" text-anchor="middle">사용자 B의 요청</text><text x="628" y="198" font-size="21" fill="#b8c8dc" text-anchor="middle">공개 매뉴얼 + 개인 질문</text><path d="M212 227 L350 293" stroke="#69dfbb" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M628 227 L490 293" stroke="#69dfbb" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="140" y="304" width="560" height="160" rx="16" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="420" y="345" font-size="28" fill="#69dfbb" text-anchor="middle">공개 매뉴얼의 KV 캐시 한 벌</text><text x="420" y="385" font-size="23" fill="#edf4ff" text-anchor="middle">첫 요청: 계산해서 저장</text><text x="420" y="424" font-size="22" fill="#edf4ff" text-anchor="middle">다른 사용자·다음 요청: HIT · 계산 재사용</text><path d="M330 470 L212 559" stroke="#8abaff" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M510 470 L628 559" stroke="#ffc580" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="32" y="573" width="360" height="163" rx="16" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="212" y="615" font-size="26" fill="#8abaff" text-anchor="middle">A 전용 컨텍스트</text><text x="212" y="655" font-size="20" fill="#b8c8dc" text-anchor="middle">개인 질문 · 대화 · 비공개 자료</text><text x="212" y="697" font-size="20" fill="#8abaff" text-anchor="middle">A의 권한 범위에서만 처리·재사용</text><rect x="448" y="573" width="360" height="163" rx="16" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="628" y="615" font-size="26" fill="#ffc580" text-anchor="middle">B 전용 컨텍스트</text><text x="628" y="655" font-size="20" fill="#b8c8dc" text-anchor="middle">개인 질문 · 대화 · 비공개 자료</text><text x="628" y="697" font-size="20" fill="#ffc580" text-anchor="middle">B의 권한 범위에서만 처리·재사용</text><text x="420" y="664" font-size="40" fill="#b8c8dc" text-anchor="middle">×</text><text x="420" y="778" font-size="23" fill="#edf4ff" text-anchor="middle">공유하는 것은 공통 입력의 계산이며, 개인 대화가 아니다.</text><rect x="32" y="816" width="776" height="153" rx="16" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="56" y="854" font-size="24" fill="#ffc580" text-anchor="start">이 구조가 성립하려면</text><text x="56" y="890" font-size="20" fill="#edf4ff" text-anchor="start">공개·개인 구간별 캐시 경계와 접근 통제를 엔진이 지원해야 한다.</text><text x="56" y="927" font-size="19" fill="#b8c8dc" text-anchor="start">vLLM의 요청 단위 cache_salt만으로 이 구조가 자동 구현되지는 않는다.</text><text x="32" y="1009" font-size="21" fill="#b8c8dc" text-anchor="start">GPU → CPU → 원격 저장소에서도 각 구간의 공유 권한을 유지한다.</text></g></svg>