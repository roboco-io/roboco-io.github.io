<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" role="img" aria-labelledby="title desc"><title id="title">05  모든 캐시를 GPU에 둘 필요는 없다</title><desc id="desc">LMCache처럼 KV 캐시를 GPU 밖 CPU 메모리, SSD 또는 원격 저장소에 보관하는 구성이 있다. 다시 사용하려면 전송 비용이 든다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="640" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27" text-anchor="start" font-weight="700">05  모든 캐시를 GPU에 둘 필요는 없다</text><rect x="160" y="92" width="520" height="90" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="420.0" y="132.0" fill="#69dfbb" font-size="23" text-anchor="middle" font-weight="600">GPU 메모리</text><text x="420.0" y="164.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">지금 계산할 때 사용하는 빠른 작업 공간</text><path d="M300 188 L300 229" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 229 L540 188" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="244" width="520" height="90" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="420.0" y="284.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">CPU 메모리</text><text x="420.0" y="316.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">GPU 밖에 KV 캐시 보관</text><path d="M300 340 L300 381" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M540 381 L540 340" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="160" y="396" width="520" height="90" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="420.0" y="436.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">SSD · 원격 저장소</text><text x="420.0" y="468.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">구성에 따라 더 많은 캐시 보관</text><text x="32" y="550" fill="#b8c8dc" font-size="22" text-anchor="start" font-weight="400">내려보내기: GPU 공간 확보</text><text x="440" y="550" fill="#b8c8dc" font-size="22" text-anchor="start" font-weight="400">불러오기: 전송 비용 발생</text><text x="420" y="604" fill="#f1f5fb" font-size="25" text-anchor="middle" font-weight="600">가져오는 비용 &lt; 다시 계산하는 비용일 때 이득</text></g></svg>