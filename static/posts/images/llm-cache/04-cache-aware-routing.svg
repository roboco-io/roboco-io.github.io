<svg xmlns="http://www.w3.org/2000/svg" width="840" height="640" viewBox="0 0 840 640" role="img" aria-labelledby="title desc"><title id="title">04  캐시가 있는 서버로 요청을 보내기</title><desc id="desc">라우터는 캐시가 있는 서버를 선호할 수 있지만 대기열과 부하도 고려해야 한다. 전송 기능이 없는 서버에서 캐시를 찾지 못하면 재계산한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="640" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27" text-anchor="start" font-weight="700">04  캐시가 있는 서버로 요청을 보내기</text><rect x="210" y="88" width="420" height="80" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="420.0" y="136.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">같은 문서를 포함한 새 요청</text><path d="M420 173 L420 208" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="210" y="220" width="420" height="90" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="420.0" y="260.0" fill="#69dfbb" font-size="23" text-anchor="middle" font-weight="600">요청 분배기: 라우터</text><text x="420.0" y="292.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">캐시 위치와 서버 부하를 함께 고려</text><path d="M330 317 L220 384" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M510 317 L620 384" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 6"/><rect x="40" y="400" width="350" height="116" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="215.0" y="453.0" fill="#69dfbb" font-size="23" text-anchor="middle" font-weight="600">서버 A: 문서 캐시 있음</text><text x="215.0" y="485.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">저장한 계산에서 이어갈 수 있음</text><rect x="450" y="400" width="350" height="116" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="625.0" y="453.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">서버 B: 문서 캐시 없음</text><text x="625.0" y="485.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">재계산 또는 캐시 전송 필요</text><text x="420" y="569" fill="#f1f5fb" font-size="23" text-anchor="middle" font-weight="600">A가 너무 붐비면 B로 보내는 편이 빠를 수도 있다.</text><text x="420" y="607" fill="#b8c8dc" font-size="21" text-anchor="middle" font-weight="400">좋은 라우팅 = 캐시 재사용 이익과 대기시간의 균형</text></g></svg>