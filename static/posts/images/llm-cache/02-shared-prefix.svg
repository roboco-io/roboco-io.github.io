<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" role="img" aria-labelledby="title desc"><title id="title">02  입력의 앞부분이 같아야 하는 이유</title><desc id="desc">같은 지침과 문서 뒤에서 질문 A와 B가 갈라지면 앞부분을 공유한다. 앞에 시각처럼 변하는 값을 넣으면 이후 문서의 계산도 달라진다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="650" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27" text-anchor="start" font-weight="700">02  입력의 앞부분이 같아야 하는 이유</text><rect x="220" y="92" width="400" height="80" rx="14" fill="#192a40" stroke="#69dfbb" stroke-width="2"/><text x="420.0" y="140.0" fill="#69dfbb" font-size="23" text-anchor="middle" font-weight="600">동일한 공통 지침 + 제품 문서</text><path d="M420 177 L420 212" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="420" y="243" fill="#69dfbb" font-size="22" text-anchor="middle" font-weight="400">여기까지 같은 앞부분 → 계산 공유</text><path d="M405 260 L185 309" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M435 260 L655 309" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="321" width="282" height="80" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="185.0" y="369.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">질문 A: 기능은?</text><rect x="514" y="321" width="282" height="80" rx="14" fill="#192a40" stroke="#8abaff" stroke-width="2"/><text x="655.0" y="369.0" fill="#8abaff" font-size="23" text-anchor="middle" font-weight="600">질문 B: 연동은?</text><text x="420" y="445" fill="#f1f5fb" font-size="23" text-anchor="middle" font-weight="600">질문이 달라도 앞부분은 재사용할 수 있다</text><path d="M32 477 H808" stroke="#65809e"/><text x="32" y="517" fill="#ffc580" font-size="23" text-anchor="start" font-weight="600">앞부분을 바꾸면?</text><rect x="32" y="542" width="190" height="74" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="127.0" y="587.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">매번 다른 시각</text><path d="M229 579 L271 579" fill="none" stroke="#65809e" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="282" y="542" width="526" height="74" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="545.0" y="587.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">같은 문서라도 이전 계산과 연결이 달라짐</text></g></svg>