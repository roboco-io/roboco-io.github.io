<svg xmlns="http://www.w3.org/2000/svg" width="840" height="665" viewBox="0 0 840 665" role="img" aria-labelledby="title desc"><title id="title">06  요청이 쌓일수록 반복 계산의 차이가 커진다</title><desc id="desc">캐시 미스 없이 공유 문서를 100회 사용하는 가상 예시. 입력 전체 105만 토큰 중 새로 프리필할 토큰은 6만 토큰으로 줄지만 이는 비용이나 실행시간의 비율을 나타내지 않는다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#65809e" stroke-width="1.5"/></marker></defs><rect width="840" height="665" rx="18" fill="#101c2d"/><g font-family="Apple SD Gothic Neo, Noto Sans CJK KR, Malgun Gothic, sans-serif"><text x="32" y="46" fill="#f1f5fb" font-size="27" text-anchor="start" font-weight="700">06  요청이 쌓일수록 반복 계산의 차이가 커진다</text><text x="32" y="95" fill="#b8c8dc" font-size="22" text-anchor="start" font-weight="400">가상 예시: 같은 문서 10,000토큰 + 새 질문 500토큰 × 100회</text><text x="32" y="151" fill="#f1f5fb" font-size="23" text-anchor="start" font-weight="600">매번 처음부터 처리</text><rect x="32" y="174" width="776" height="64" rx="10" fill="#8abaff"/><text x="420" y="216" fill="#101c2d" font-size="26" text-anchor="middle" font-weight="700">1,050,000토큰</text><text x="32" y="298" fill="#f1f5fb" font-size="23" text-anchor="start" font-weight="600">공통 문서를 한 번 계산하고 99회 재사용</text><rect x="32" y="323" width="45" height="64" rx="8" fill="#69dfbb"/><text x="100" y="365" fill="#69dfbb" font-size="26" text-anchor="start" font-weight="700">60,000토큰만 새로 프리필</text><text x="32" y="441" fill="#b8c8dc" font-size="23" text-anchor="start" font-weight="400">10,000 + (500 × 100) = 60,000</text><rect x="32" y="485" width="776" height="102" rx="14" fill="#192a40" stroke="#ffc580" stroke-width="2"/><text x="420.0" y="531.0" fill="#ffc580" font-size="23" text-anchor="middle" font-weight="600">새로 처리하는 입력 토큰 약 94.3% 감소</text><text x="420.0" y="563.0" fill="#b8c8dc" font-size="18" text-anchor="middle" font-weight="400">캐시 읽기 · 메모리 · 전송 · 답변 생성 비용은 남는다</text><text x="420" y="629" fill="#b8c8dc" font-size="22" text-anchor="middle" font-weight="400">토큰 재처리 감소율은 전체 비용 절감률과 다르다.</text></g></svg>